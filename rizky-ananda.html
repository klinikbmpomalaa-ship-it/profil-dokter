<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Tenaga Kesehatan - Klinik Budi Medika Pomalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Lato, sans-serif;
    background: linear-gradient(135deg, #e8f4f8 0%, #d6eef8 50%, #c5e8f5 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    width: 420px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,140,200,0.18), 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(135deg, #0098c8 0%, #005f99 100%);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-header::after {
    content: "";
    position: absolute;
    bottom: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .logo-wrap img {
    height: 52px; width: auto;
    
  }
  .photo-area {
    display: flex;
    justify-content: center;
    padding: 28px 0 0;
  }
  .photo-frame {
    width: 140px; height: 160px;
    border-radius: 14px;
    border: 4px solid #0098c8;
    box-shadow: 0 8px 24px rgba(0,152,200,0.25);
    overflow: hidden;
    background: #e8f4f8;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .photo-placeholder { font-size: 64px; color: #0098c8; opacity: 0.4; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #0098c8, #005f99);
    color: #fff;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .info-area { padding: 20px 32px 28px; text-align: center; }
  .staff-name {
    font-family: Georgia, serif;
    font-size: 22px; font-weight: 700;
    color: #003d66; margin-bottom: 4px; line-height: 1.3;
  }
  .divider {
    width: 50px; height: 3px;
    background: linear-gradient(90deg, #0098c8, #7aba1e);
    border-radius: 2px; margin: 12px auto;
  }
  .detail-row {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 8px; margin-bottom: 8px;
  }
  .detail-label {
    font-size: 12px; font-weight: 700;
    color: #0098c8; text-transform: uppercase;
    letter-spacing: 1px; white-space: nowrap; min-width: 80px; text-align: right;
  }
  .detail-value { font-size: 14px; color: #333; font-weight: 400; text-align: left; }
  .footer-strip {
    background: linear-gradient(135deg, #7aba1e 0%, #5a9c00 100%);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .footer-strip span { font-size: 12px; color: #fff; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
